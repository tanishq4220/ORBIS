services:
  - type: web
    name: orbis-sda
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: ORBIS_OFFLINE_AUTH
        value: "1"
      - key: DB_NAME
        value: "app"
      - key: SESSION_SECRET
        generateValue: true
